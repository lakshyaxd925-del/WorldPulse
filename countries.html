<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Countries — WorldPulse</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
    --blue:#1264ff;
    --bg:#f4f7fb;
    --card:#fff;
    --text:#172033;
    --muted:#667085;
    --border:#e4e8f0;
    --green:#12b76a;
}

body.dark{
    --bg:#0b1220;
    --card:#151f31;
    --text:#f8fafc;
    --muted:#aab4c4;
    --border:#2b374c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 6%;
}

.nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:var(--blue);
    text-decoration:none;
    font-size:24px;
    font-weight:800;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    text-decoration:none;
    color:var(--muted);
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:var(--blue);
}

#theme{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:55px 20px 30px;
}

.hero h1{
    font-size:48px;
    margin:10px 0;
}

.hero span{
    color:var(--blue);
}

.hero p{
    color:var(--muted);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.search{
    position:relative;
    margin-bottom:25px;
}

#search{
    width:100%;
    padding:17px 20px;
    border:1px solid var(--border);
    border-radius:15px;
    background:var(--card);
    color:var(--text);
    font-size:16px;
    outline:none;
}

#suggestions{
    position:absolute;
    left:0;
    right:0;
    top:58px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    z-index:2000;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.suggestion{
    padding:14px 18px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
}

.suggestion:hover{
    background:rgba(18,100,255,.08);
}

.map-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:35px;
}

#map{
    width:100%;
    height:500px;
}

.section-title{
    margin:35px 0 18px;
}

.section-title h2{
    margin:0;
}

.section-title p{
    color:var(--muted);
}

.rankings{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.rank{
    display:grid;
    grid-template-columns:60px 1fr 180px;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
}

.rank:last-child{
    border-bottom:0;
}

.rank-number{
    font-weight:bold;
}

.country-name{
    color:var(--text);
    text-decoration:none;
    font-weight:bold;
}

.country-name:hover{
    color:var(--blue);
}

.population{
    text-align:right;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
    color:var(--muted);
}

footer{
    margin-top:60px;
    background:#101828;
    color:white;
    text-align:center;
    padding:30px;
}

@media(max-width:700px){

    nav{
        display:none;
    }

    .hero h1{
        font-size:38px;
    }

    #map{
        height:380px;
    }

    .rank{
        grid-template-columns:40px 1fr;
        gap:8px;
    }

    .population{
        grid-column:2;
        text-align:left;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">

<a class="logo" href="index.html">
🌍 WorldPulse
</a>

<nav>
<a href="index.html">Home</a>
<a href="world.html">World</a>
<a href="countries.html">Countries</a>
</nav>

<button id="theme">🌙</button>

</div>
</header>


<section class="hero">

<div style="font-size:65px">🗺️</div>

<h1>Explore the <span>World</span></h1>

<p>
Search countries, explore the map and compare populations.
</p>

</section>


<div class="container">

<div class="search">

<input
id="search"
placeholder="🔎 Search any country..."
autocomplete="off">

<div id="suggestions"></div>

</div>


<div class="map-box">

<div id="map"></div>

</div>


<div class="section-title">

<h2>🏆 Population Ranking</h2>

<p>
Latest available World Bank population observations.
</p>

</div>


<div class="rankings" id="rankings">

<div class="loading">
Loading countries...
</div>

</div>

</div>


<footer>

© 2026 WorldPulse<br>

Population data:
<a
href="https://data.worldbank.org/indicator/SP.POP.TOTL"
target="_blank"
style="color:#9ec1ff">
World Bank
</a>

</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================
   DARK MODE
===================================== */

const theme =
document.getElementById("theme");

if(
localStorage.getItem("worldpulse-theme")
==="dark"
){
    document.body.classList.add("dark");
    theme.textContent="☀️";
}

theme.onclick=()=>{

    document.body.classList.toggle("dark");

    const dark =
    document.body.classList.contains("dark");

    localStorage.setItem(
        "worldpulse-theme",
        dark ? "dark" : "light"
    );

    theme.textContent =
    dark ? "☀️" : "🌙";
};


/* =====================================
   COUNTRY DATA
===================================== */

let countries=[];
let populations={};


/* =====================================
   LOAD COUNTRY LIST
===================================== */

async function loadCountries(){

    try{

        const response =
        await fetch(
        "https://api.worldbank.org/v2/country?format=json&per_page=400"
        );

        const data =
        await response.json();

        countries =
        data[1]
        .filter(c =>
            c.region &&
            c.region.id !== "NA"
        );

        loadPopulation();

    }catch(error){

        console.error(error);

    }
}


/* =====================================
   LOAD POPULATION
===================================== */

async function loadPopulation(){

    try{

        const response =
        await fetch(
        "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=4000&mrv=1"
        );

        const data =
        await response.json();

        data[1].forEach(row=>{

            if(
                row.countryiso3code &&
                row.value !== null
            ){

                populations[
                    row.countryiso3code
                ]={
                    value:Number(row.value),
                    year:Number(row.date)
                };

            }

        });

        renderRankings();

    }catch(error){

        console.error(error);

        document.getElementById("rankings")
        .innerHTML=
        "<div class='loading'>Unable to load data.</div>";

    }
}


/* =====================================
   RANKINGS
===================================== */

function renderRankings(){

    const box =
    document.getElementById("rankings");

    const ranking =
    countries
    .map(country=>{

        const code =
        country.id;

        return {

            code,

            name:
            country.name,

            population:
            populations[code]
            ? populations[code].value
            : 0

        };

    })
    .filter(x=>x.population>0)
    .sort(
        (a,b)=>
        b.population-a.population
    )
    .slice(0,100);


    box.innerHTML="";

    ranking.forEach(
    (country,index)=>{

        const row =
        document.createElement("div");

        row.className="rank";

        row.innerHTML=`

        <div class="rank-number">
            #${index+1}
        </div>

        <div>
            <a
            class="country-name"
            href="country.html?country=${country.code}">
                ${country.name}
            </a>
        </div>

        <div class="population">
            ${country.population.toLocaleString()}
        </div>

        `;

        box.appendChild(row);

    });

}


/* =====================================
   SEARCH
===================================== */

const search =
document.getElementById("search");

const suggestions =
document.getElementById("suggestions");


search.addEventListener(
"input",
()=>{

    const query =
    search.value
    .trim()
    .toLowerCase();

    suggestions.innerHTML="";

    if(!query)
        return;


    const results =
    countries
    .filter(country =>
        country.name
        .toLowerCase()
        .includes(query)
    )
    .slice(0,10);


    results.forEach(country=>{

        const item =
        document.createElement("div");

        item.className="suggestion";

        item.textContent =
        country.name;

        item.onclick=()=>{

            window.location.href =
            "country.html?country="
            +country.id;

        };

        suggestions.appendChild(item);

    });

});


document.addEventListener(
"click",
event=>{

    if(!event.target.closest(".search"))
        suggestions.innerHTML="";

});


/* =====================================
   MAP
===================================== */

const map =
L.map("map")
 .setView([20,0],2);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    attribution:
    '&copy; OpenStreetMap contributors'
}
).addTo(map);


/*
This GeoJSON contains country boundaries.
*/

fetch(
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
)
.then(response=>response.json())
.then(geojson=>{

    L.geoJSON(
        geojson,
        {

            style:feature=>{

                const code =
                feature.properties.ISO_A3;

                const population =
                populations[code]
                ? populations[code].value
                : 0;


                return {

                    fillColor:
                    populationColor(
                        population
                    ),

                    weight:1,

                    color:"#ffffff",

                    fillOpacity:.72

                };

            },


            onEachFeature:
            (feature,layer)=>{

                const code =
                feature.properties.ISO_A3;

                const name =
                feature.properties.ADMIN
                ||
                feature.properties.NAME
                ||
                "Country";


                const population =
                populations[code]
                ? populations[code].value
                : null;


                layer.bindPopup(`

                    <strong>
                        ${name}
                    </strong>

                    <br><br>

                    ${
                    population
                    ?
                    "Population: "
                    +
                    population.toLocaleString()
                    :
                    "Population unavailable"
                    }

                    <br><br>

                    ${
                    populations[code]
                    ?
                    `<a href="country.html?country=${code}">
                    View country →
                    </a>`
                    :
                    ""
                    }

                `);


                layer.on({

                    mouseover:event=>{

                        event.target.setStyle({
                            weight:2,
                            fillOpacity:.9
                        });

                    },

                    mouseout:event=>{

                        event.target.setStyle({
                            weight:1,
                            fillOpacity:.72
                        });

                    }

                });

            }

        }
    ).addTo(map);

})
.catch(error=>{
    console.error(
        "Map data error:",
        error
    );
});


/* =====================================
   MAP COLORS
===================================== */

function populationColor(population){

    if(!population)
        return "#d9dee8";

    if(population>=1000000000)
        return "#083b9c";

    if(population>=500000000)
        return "#1264ff";

    if(population>=100000000)
        return "#4b8cff";

    if(population>=50000000)
        return "#7aa8ff";

    if(population>=10000000)
        return "#a8c4ff";

    return "#d2e0ff";
}


/* =====================================
   START
===================================== */

loadCountries();

</script>

</body>
</html>
