<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Dashboard — WorldPulse</title>

<style>

:root{
    --blue:#1264ff;
    --bg:#f4f7fb;
    --card:#fff;
    --text:#172033;
    --muted:#667085;
    --border:#e4e8f0;
}

body.dark{
    --bg:#0b1220;
    --card:#151f31;
    --text:#f8fafc;
    --muted:#aab4c4;
    --border:#2b374c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:15px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:var(--blue);
    text-decoration:none;
    font-size:24px;
    font-weight:800;
}

button{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    font-size:17px;
}

.hero{
    text-align:center;
    padding:60px 20px 35px;
}

.globe{
    font-size:75px;
}

.hero h1{
    font-size:46px;
    margin:10px 0;
}

.hero p{
    color:var(--muted);
}

.container{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.main{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:23px;
    padding:42px 20px;
    text-align:center;
}

.label{
    color:var(--muted);
    font-size:13px;
    font-weight:bold;
}

#population{
    color:var(--blue);
    font-size:clamp(40px,7vw,68px);
    font-weight:800;
    margin:12px 0;
}

.status{
    color:var(--muted);
    font-size:12px;
}

.section{
    margin-top:45px;
}

.section h2{
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:23px;
}

.card h3{
    color:var(--muted);
    font-size:14px;
}

.value{
    font-size:27px;
    font-weight:800;
    margin-top:8px;
}

.rankings{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.rank{
    display:grid;
    grid-template-columns:55px 1fr 170px;
    align-items:center;
    padding:17px 20px;
    border-bottom:1px solid var(--border);
}

.rank:last-child{
    border-bottom:0;
}

.position{
    font-size:20px;
    font-weight:bold;
}

.rank-name{
    display:flex;
    align-items:center;
    gap:12px;
}

.rank-flag{
    font-size:28px;
}

.rank-name a{
    color:var(--text);
    text-decoration:none;
    font-weight:bold;
}

.rank-name a:hover{
    color:var(--blue);
}

.rank-pop{
    text-align:right;
    font-weight:bold;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    margin-bottom:15px;
}

footer{
    margin-top:60px;
    background:#101828;
    color:white;
    text-align:center;
    padding:30px;
}

footer a{
    color:#9ec1ff;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .rank{
        grid-template-columns:40px 1fr;
        gap:10px;
    }

    .rank-pop{
        grid-column:2;
        text-align:left;
    }
}

</style>

</head>

<body>

<header>

<a class="logo" href="index.html">
🌍 WorldPulse
</a>

<button id="theme">🌙</button>

</header>


<section class="hero">

<div class="globe">🌎</div>

<h1>World Dashboard</h1>

<p>
Global population and country rankings.
</p>

</section>


<div class="container">

<section class="main">

<div class="label">
ESTIMATED WORLD POPULATION
</div>

<div id="population">
Loading...
</div>

<div class="status" id="status">
Connecting...
</div>

</section>


<section class="section">

<h2>📊 Global Overview</h2>

<div class="grid">

<div class="card">
<h3>Latest Population</h3>
<div class="value" id="latest">—</div>
</div>

<div class="card">
<h3>Data Year</h3>
<div class="value" id="year">—</div>
</div>

<div class="card">
<h3>Annual Growth</h3>
<div class="value" id="growth">—</div>
</div>

</div>

</section>


<section class="section">

<h2>🏆 Most Populous Countries</h2>

<input
class="search"
id="search"
placeholder="Filter rankings...">

<div class="rankings" id="rankings">

<div style="padding:30px;text-align:center">
Loading country rankings...
</div>

</div>

</section>

</div>


<footer>

© 2026 WorldPulse<br>

Population:
<a
href="https://data.worldbank.org/indicator/SP.POP.TOTL"
target="_blank">
World Bank
</a>

</footer>


<script>

const WORLD_API =
"https://api.worldbank.org/v2/country/WLD/indicator/SP.POP.TOTL?format=json&per_page=10";


const rankingCountries = [

["IND","🇮🇳","India"],
["CHN","🇨🇳","China"],
["USA","🇺🇸","United States"],
["IDN","🇮🇩","Indonesia"],
["PAK","🇵🇰","Pakistan"],
["NGA","🇳🇬","Nigeria"],
["BRA","🇧🇷","Brazil"],
["BGD","🇧🇩","Bangladesh"],
["RUS","🇷🇺","Russia"],
["MEX","🇲🇽","Mexico"],
["JPN","🇯🇵","Japan"],
["ETH","🇪🇹","Ethiopia"],
["PHL","🇵🇭","Philippines"],
["EGY","🇪🇬","Egypt"],
["VNM","🇻🇳","Vietnam"]

];


async function loadWorld(){

    try{

        const response =
        await fetch(WORLD_API);

        const json =
        await response.json();

        const rows =
        json[1].filter(
            x=>x.value!==null
        );

        const latest =
        Number(rows[0].value);

        const previous =
        Number(rows[1].value);

        const latestYear =
        Number(rows[0].date);

        document.getElementById("latest")
        .textContent =
        latest.toLocaleString();

        document.getElementById("year")
        .textContent =
        latestYear;

        document.getElementById("growth")
        .textContent =
        (
            ((latest-previous)/previous)
            *100
        ).toFixed(2)+"%";

        document.getElementById("status")
        .textContent =
        "World Bank • "+latestYear;


        const yearlyChange =
        latest-previous;

        const start =
        new Date(latestYear,0,1);

        function update(){

            const elapsed =
            (new Date()-start) /
            (1000*60*60*24);

            const estimate =
            latest+
            yearlyChange*
            (elapsed/365.2425);

            document.getElementById("population")
            .textContent =
            Math.round(estimate)
            .toLocaleString();

        }

        update();
        setInterval(update,1000);


        loadRankings();


    }catch(error){

        document.getElementById("status")
        .textContent =
        "Unable to load data";

    }

}


async function loadRankings(){

    const container =
    document.getElementById("rankings");

    try{

        const codes =
        rankingCountries
        .map(x=>x[0])
        .join(";");

        const url =
        `https://api.worldbank.org/v2/country/${codes}/indicator/SP.POP.TOTL?format=json&per_page=100`;

        const response =
        await fetch(url);

        const json =
        await response.json();

        const rows =
        json[1].filter(
            x=>x.value!==null
        );

        /*
          Get the newest observation for
          each country.
        */

        const latest = {};

        rows.forEach(row=>{

            if(
                !latest[row.countryiso3code]
                ||
                Number(row.date)
                >
                Number(
                    latest[row.countryiso3code].date
                )
            ){

                latest[row.countryiso3code] =
                row;

            }

        });


        const data =
        rankingCountries
        .map(country=>{

            const row =
            latest[country[0]];

            return {

                code:country[0],
                flag:country[1],
                name:country[2],
                population:
                row
                ? Number(row.value)
                : 0

            };

        })
        .sort(
            (a,b)=>
            b.population-a.population
        );


        container.innerHTML = "";

        data.forEach(
            (country,index)=>{

                const row =
                document.createElement("div");

                row.className="rank";

                row.dataset.name =
                country.name.toLowerCase();

                row.innerHTML = `

                <div class="position">
                    #${index+1}
                </div>

                <div class="rank-name">

                    <span class="rank-flag">
                        ${country.flag}
                    </span>

                    <a href="country.html?country=${country.code}">
                        ${country.name}
                    </a>

                </div>

                <div class="rank-pop">

                    ${
                        country.population
                        ? country.population
                          .toLocaleString()
                        : "Unavailable"
                    }

                </div>

                `;

                container.appendChild(row);

            }
        );


    }catch(error){

        console.error(error);

        container.innerHTML =
        `<div style="padding:25px">
        Unable to load rankings.
        </div>`;

    }

}


document.getElementById("search")
.addEventListener("input",function(){

    const query =
    this.value.toLowerCase();

    document.querySelectorAll(".rank")
    .forEach(row=>{

        row.style.display =
        row.dataset.name.includes(query)
        ? ""
        : "none";

    });

});


/* Dark mode */

const theme =
document.getElementById("theme");

if(
localStorage.getItem("worldpulse-theme")
==="dark"
){

    document.body.classList.add("dark");
    theme.textContent="☀️";

}

theme.onclick=()=>{

    document.body.classList.toggle("dark");

    const dark =
    document.body.classList.contains("dark");

    localStorage.setItem(
        "worldpulse-theme",
        dark?"dark":"light"
    );

    theme.textContent =
    dark?"☀️":"🌙";

};


loadWorld();

</script>

</body>
</html>
